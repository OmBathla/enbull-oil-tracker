<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enbull Oil Change Tracker — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="auth-wrapper">
  <button id="themeToggleBtn" class="icon-btn auth-theme-btn" aria-label="Toggle dark mode">🌙</button>

  <div class="auth-brand">
    <img src="logo.png" alt="Enbull Lubricants" class="brand-logo-img">
    <h1>Enbull</h1>
    <p class="brand-sub">Oil Change Tracker</p>
  </div>

  <div class="auth-card">
    <div id="loginPanel">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to manage your service records</p>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
        <label>Password</label>
        <input type="password" id="loginPassword" required>
        <button type="submit" class="btn-primary auth-submit">Log In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
    </div>

    <div id="signupPanel" style="display:none;">
      <h2>Create your account</h2>
      <p class="auth-subtitle">Start tracking Enbull oil change records</p>
      <form id="signupForm">
        <label>Full Name</label>
        <input type="text" id="signupName" required>
        <label>Email</label>
        <input type="email" id="signupEmail" required>
        <label>Password</label>
        <input type="password" id="signupPassword" required minlength="4">
        <button type="submit" class="btn-primary auth-submit">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="#" id="showLogin">Log in</a></p>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script type="module" src="auth-page.js"></script>
</body>
</html>
