<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enbull Oil Change Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-logo">🛢️</div>
    <div>
      <h1>Enbull</h1>
      <p class="brand-sub">Oil Change Tracker</p>
    </div>
  </div>
  <div class="header-actions">
    <button id="loadSampleBtn" class="btn-primary">Load sample data</button>
    <div class="user-chip">
      <span id="userNameLabel">User</span>
      <button id="logoutBtn" class="btn-secondary">Log out</button>
    </div>
  </div>
</header>

<section id="dashboard">
  <div class="stat-card">
    <div class="stat-head">
      <h3>Total Customers</h3>
      <span class="icon-chip chip-blue">📋</span>
    </div>
    <p id="totalCustomers">0</p>
  </div>
  <div class="stat-card due">
    <div class="stat-head">
      <h3>Due Soon</h3>
      <span class="icon-chip chip-amber">⏳</span>
    </div>
    <p id="dueSoonCount">0</p>
  </div>
  <div class="stat-card overdue">
    <div class="stat-head">
      <h3>Overdue</h3>
      <span class="icon-chip chip-red">⚠️</span>
    </div>
    <p id="overdueCount">0</p>
  </div>
</section>

<section id="formSection">
  <h2 id="formTitle">Add Customer & Oil Change Record</h2>
  <form id="recordForm">
    <input type="hidden" id="recordId">

    <label>Customer Name</label>
    <input type="text" id="customerName" required>

    <label>Phone Number</label>
    <input type="text" id="phone" required>

    <label>Bike Model</label>
    <input type="text" id="bikeModel" required>

    <label>Current Mileage (km)</label>
    <input type="number" id="currentMileage" required>

    <label>Enbull Oil Product</label>
    <select id="oilProduct" required>
      <option value="">-- Select --</option>
      <option value="Enbull Standard">Enbull Standard (3000km / 3mo)</option>
      <option value="Enbull Synthetic">Enbull Synthetic (5000km / 6mo)</option>
      <option value="Enbull Premium">Enbull Premium (7000km / 8mo)</option>
    </select>

    <label>Oil Change Date</label>
    <input type="date" id="lastChangeDate" required>

    <label>Mileage at Oil Change (km)</label>
    <input type="number" id="lastChangeMileage" required>

    <button type="submit" id="submitBtn">Add Record</button>
    <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
  </form>
</section>

<section id="searchSection">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by name or phone...">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Safe">Safe</button>
      <button class="filter-btn" data-filter="Due Soon">Due Soon</button>
      <button class="filter-btn" data-filter="Overdue">Overdue</button>
    </div>
    <button id="exportCsvBtn" class="btn-secondary">Export CSV</button>
  </div>
</section>

<section id="recordsSection">
  <table id="recordsTable">
    <thead>
      <tr>
        <th data-key="customerName">Customer <span class="sort-indicator"></span></th>
        <th data-key="phone">Phone <span class="sort-indicator"></span></th>
        <th data-key="bikeModel">Bike <span class="sort-indicator"></span></th>
        <th data-key="oilProduct">Oil Product <span class="sort-indicator"></span></th>
        <th data-key="lastChangeDate">Last Change <span class="sort-indicator"></span></th>
        <th data-key="nextDueMileage">Next Due (km) <span class="sort-indicator"></span></th>
        <th data-key="nextDueDate">Next Due (date) <span class="sort-indicator"></span></th>
        <th data-key="status">Status <span class="sort-indicator"></span></th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="recordsBody">
      <!-- rows injected by JS -->
    </tbody>
  </table>
</section>

<div id="toastContainer" class="toast-container"></div>

<script type="module" src="app.js"></script>
</body>
</html>
